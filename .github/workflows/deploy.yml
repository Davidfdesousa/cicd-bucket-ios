name: Deploy

# Promoção por branch:
#   develop     → [DEV]  a cada merge (inclusive o PR automático de design tokens)
#   release/**  → [HOM]  ao criar/atualizar uma branch de release
#   main        → [PROD] ao promover a release
#
# Cada ambiente é um GitHub Environment (dev, hom, prod). Para exigir aprovação
# em produção, adicione "Required reviewers" no environment `prod`.
# A lógica fica em Davidfdesousa/cicd-workflows.

on:
  push:
    branches: [develop, 'release/**', main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  design-tokens:
    uses: Davidfdesousa/cicd-workflows/.github/workflows/tokens-validate.yml@v1
    with:
      platform: ios

  deploy:
    needs: design-tokens
    uses: Davidfdesousa/cicd-workflows/.github/workflows/deploy-environments.yml@v1
    with:
      verify-command: npm ci && npm run lint && npm run typecheck && npm test && npm run build
      package-paths: dist design-tokens
      # Vazio = deploy simulado. O comando recebe ENVIRONMENT, BUNDLE_DIR e, de cada
      # environment, a variável DEPLOY_TARGET e o secret DEPLOY_TOKEN.
      deploy-command: ''
    secrets: inherit
