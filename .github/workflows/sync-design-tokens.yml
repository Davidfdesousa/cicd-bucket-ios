name: Sync design tokens

# Recebe o evento `design-tokens-released` enviado pelo cicd-create-tokens após
# uma release estável e abre/atualiza o PR `feat/design-tokens` → `develop`.
# Também roda manualmente: informe uma versão para instalar uma pré-release (rc)
# ou fazer rollback. A lógica fica em Davidfdesousa/cicd-workflows.

on:
  repository_dispatch:
    types: [design-tokens-released]
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão publicada no cicd-create-tokens (ex.: 1.2.0 ou 2.0.0-rc.1)'
        type: string
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    uses: Davidfdesousa/cicd-workflows/.github/workflows/tokens-sync.yml@v1
    with:
      version: ${{ github.event.client_payload.version || inputs.version }}
      source-repository: ${{ github.event.client_payload.source || vars.TOKENS_SOURCE_REPOSITORY }}
      asset: tokens-ios.zip
    secrets:
      SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
